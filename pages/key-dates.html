<section class="key-dates-page">
  <div class="page-title-row key-dates-toolbar">
    <div><h1>KEY DATES</h1><p class="page-subtitle">Jahresübersicht St. Peter/Mitterberg</p></div>
    <div class="key-dates-controls">
      <div class="key-dates-view-toggle" role="group" aria-label="Key-Dates-Filter">
        <button type="button" data-kd-filter="key" class="btn btn-primary" aria-pressed="true">Nur Key Dates</button>
        <button type="button" data-kd-filter="all" class="btn btn-secondary" aria-pressed="false">Alle Einträge</button>
      </div>
      <label for="kdJahr">Jahr<select id="kdJahr" class="form-control"></select></label>
      <button id="kdPdf" class="btn btn-primary" type="button" title="PDF speichern">PDF</button>
      <button id="kdDrucken" class="btn btn-secondary" type="button">Drucken</button>
    </div>
  </div>
  <p id="kdFehler" class="form-message" hidden></p>
  <p id="kdEmpty" class="form-message" hidden></p>
  <div class="key-dates-scroll"><div id="kdSeiten" class="key-dates-pages"></div></div>
</section>
