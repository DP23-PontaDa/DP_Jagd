<section class="stammdaten-page">

    <h1>Stammdaten</h1>

    <div class="action-bar">

        <div></div>

        <div class="btn-group">

            <button
                id="wgNeu"
                class="btn btn-primary"
                type="button">
                + Neue Wildgruppe
            </button>

        </div>

    </div>

    <table class="ap-table">

        <thead>

            <tr>
                <th class="col-number">Nr.</th>
                <th class="col-short">Code</th>
                <th>Bezeichnung</th>
                <th class="col-boolean">Abschussplan</th>
                <th class="col-boolean">Aktiv</th>
                <th class="col-actions">Aktion</th>
            </tr>

        </thead>

        <tbody id="wgTabelleBody"></tbody>

    </table>

</section>


<!-- ===================================================== -->
<!-- Modal Wildgruppe                                      -->
<!-- ===================================================== -->

<div id="wgModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="wgModalTitel">
                Wildgruppe
            </h2>
            <div class="detail-header-actions">
                <button id="wgDetailEdit" class="action-btn edit-btn" type="button" title="Bearbeiten" aria-label="Bearbeiten"></button>
                <button id="wgDetailDelete" class="action-btn delete-btn" type="button" title="Löschen" aria-label="Löschen"></button>
            </div>

            <span
                id="wgSchliessen"
                class="close-btn"
                role="button"
                tabindex="0"
                aria-label="Schließen">
                &times;
            </span>

        </div>

        <div class="form-grid">

            <div class="form-group">
                <label for="wgReihenfolge" class="required">Reihenfolge</label>
                <input id="wgReihenfolge" class="form-control" type="number" min="1" step="1">
            </div>

            <div class="form-group">
                <label for="wgCode" class="required">
                    Code
                </label>

                <input
                    id="wgCode"
                    class="form-control"
                    type="text"
                    maxlength="20"
                    style="text-transform: uppercase;">

            </div>

            <div class="form-group">

                <label for="wgBezeichnung" class="required">
                    Bezeichnung
                </label>

                <input
                    id="wgBezeichnung"
                    class="form-control"
                    type="text">

            </div>

            <div class="form-group">
                <label for="wgAbschussplan">Abschussplan</label>
                <input id="wgAbschussplan" type="checkbox">
            </div>

            <div class="form-group">

                <label for="wgAktiv">
                    Aktiv
                </label>

                <input
                    id="wgAktiv"
                    type="checkbox">

            </div>

        </div>

        <div class="modal-footer">

            <button
                id="wgSpeichern"
                class="btn btn-primary"
                type="button">
                Speichern
            </button>

            <button
                id="wgAbbrechen"
                class="btn btn-outline"
                type="button">
                Abbrechen
            </button>

        </div>

    </div>

</div>
