<section class="jaegerbericht-page">
  <div class="page-title-row jaegerbericht-toolbar">
    <div>
      <h1>Jägerdatenblatt</h1>
      <p class="page-subtitle">Persönliche Jägerdaten als mehrseitige A4-Auswertung</p>
    </div>
    <div class="jaegerbericht-controls">
      <label id="jbJaegerAuswahl">Person / Bericht
        <div id="jbJaeger"></div>
      </label>
      <div id="jbEigenerJaeger" class="jaegerbericht-eigener-jaeger" hidden></div>
      <label for="jbVonJahr">Von Jahr
        <select id="jbVonJahr" class="form-control"></select>
      </label>
      <label for="jbBisJahr">Bis Jahr
        <select id="jbBisJahr" class="form-control"></select>
      </label>
      <output id="jbZeitraum" class="jb-zeitraum">Berichtszeitraum: –</output>
      <button id="jbAnzeigen" class="btn btn-primary" type="button">Bericht anzeigen</button>
      <button id="jbPdf" class="btn btn-secondary" type="button" title="Browserdruck öffnen und als PDF speichern" disabled>PDF / Drucken</button>
      <button id="jbDrucken" class="btn btn-secondary" type="button" disabled>Drucken</button>
    </div>
  </div>
  <p id="jbStatus" class="form-message">Bitte einen Jäger auswählen.</p>
  <div class="jaegerbericht-scroll">
    <div id="jbSeiten" class="jaegerbericht-pages"></div>
  </div>
</section>
