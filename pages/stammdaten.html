<section class="stammdaten-page">

    <h1>Stammdaten</h1>

    <div class="action-bar">

        <div class="search-group">

            <label for="sdWildgruppe">
                Wildgruppe
            </label>

            <select
                id="sdWildgruppe"
                class="search-select">
            </select>

        </div>

        <div class="btn-group">

            <button
                id="sdNeueKlasse"
                class="btn btn-primary">
                Neue Wildklasse
            </button>

        </div>

    </div>

    <table class="ap-table">

        <thead>

            <tr>
                <th class="col-number">Nr.</th>
                <th class="col-short">Code</th>
                <th>Bezeichnung</th>
                <th class="col-short">Stehzeit Jahre</th>
                <th class="col-short">Nicht passend</th>
                <th>Kahlwildpflicht-Regeln</th>
                <th class="col-boolean">Aktiv</th>
                <th class="col-actions">Aktion</th>
            </tr>

        </thead>

        <tbody id="sdWildklassenBody"></tbody>

    </table>

</section>


<!-- ===================================================== -->
<!-- Modal Wildklasse                                      -->
<!-- ===================================================== -->

<div id="sdWildklasseModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="sdWildklasseTitel">
                Wildklasse
            </h2>
            <div class="detail-header-actions">
                <button id="sdDetailEdit" class="action-btn edit-btn" type="button" title="Bearbeiten" aria-label="Bearbeiten"></button>
                <button id="sdDetailDelete" class="action-btn delete-btn" type="button" title="Löschen" aria-label="Löschen"></button>
            </div>

            <span
                id="sdSchliessen"
                class="close-btn">
                &times;
            </span>

        </div>

        <div class="form-grid">

            <div class="form-group">

                <label for="sdStehzeit">Stehzeit Jahre</label>

                <input id="sdStehzeit" class="form-control" type="number" min="0" step="1">

            </div>

            <div class="form-group">
                <label for="sdStehzeitNichtPassend">Stehzeit bei nicht passend</label>
                <input id="sdStehzeitNichtPassend" class="form-control" type="number" min="0" step="1">
            </div>

            <div class="form-group">

                <label class="required">
                    Code
                </label>

                <input
                    id="sdCode"
                    class="form-control"
                    type="text"
                    maxlength="20"
                    style="text-transform: uppercase;">

            </div>

            <div class="form-group">

                <label class="required">
                    Bezeichnung
                </label>

                <input
                    id="sdBezeichnung"
                    class="form-control"
                    type="text">

            </div>

            <div class="form-group">

                <label>
                    Reihenfolge
                </label>

                <input
                    id="sdReihenfolge"
                    class="form-control"
                    type="number"
                    min="1">

            </div>

            <div class="form-group">

                <label>
                    Aktiv
                </label>

                <input
                    id="sdAktiv"
                    type="checkbox">

            </div>

        </div>

        <section class="ap-overview-group">
            <h3>Kahlwildpflicht</h3>
            <div class="table-wrap"><table class="ap-table"><thead><tr><th>Gültig ab</th><th>Stück pro Hirsch</th><th>Aktionen</th></tr></thead><tbody id="sdKahlwildregelnBody"></tbody></table></div>
            <div id="sdKahlwildregelForm" class="form-grid" hidden>
                <div class="form-group"><label for="sdKahlwildregelJahr">Gültig ab</label><input id="sdKahlwildregelJahr" class="form-control" type="number" min="1900" max="2999" step="1" inputmode="numeric"></div>
                <div class="form-group"><label for="sdKahlwildregelAnzahl">Stück pro Hirsch</label><input id="sdKahlwildregelAnzahl" class="form-control" type="number" min="0" step="1"></div>
                <div class="btn-group"><button id="sdKahlwildregelSpeichern" class="btn btn-primary" type="button">Regel speichern</button><button id="sdKahlwildregelAbbrechen" class="btn btn-outline" type="button">Abbrechen</button></div>
            </div>
            <button id="sdKahlwildregelNeu" class="btn btn-outline" type="button">+ Kahlwildpflicht</button>
            <p id="sdKahlwildregelHinweis" class="form-message"></p>
        </section>

        <div class="modal-footer">

            <button
                id="sdSpeichern"
                class="btn btn-primary">
                Speichern
            </button>

            <button
                id="sdAbbrechen"
                class="btn btn-outline">
                Abbrechen
            </button>

        </div>

    </div>

</div>
